name: Attack box image

# Builds cyberctf/attack-box (the Dockerfile here) for amd64 and arm64 on native runners and
# publishes one multi-arch tag to Docker Hub. Rebuilt weekly because Kali is a rolling release.
# Every run first checks the scripts and builds the image locally and smoke-tests it
# (smoke-test.sh), on pull requests too; only a push to main, the weekly run or a manual run
# publishes, and only once the smoke test passed on both architectures, so a broken Kali update
# never reaches players. The launcher doesn't follow `latest`: it pins the image by digest, with
# this repository's files as they were at the commit that published it. Once a publish is out, the
# pushed digest is pulled and smoke-tested again on both architectures, then the `pin` job opens a
# pull request into the launcher's dev with both. Each architecture's image carries BuildKit's
# provenance attestation, and the published index a GitHub build provenance attestation
# (README.md, "Verify the image").
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: cyberctf/attack-box

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The VM set-up's compositions parse, and shellcheck (check.sh, as a contributor runs it).
      - run: ./check.sh scripts

  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image is large (~14 GB unpacked): Docker keeps its data on the runner's scratch disk.
      - uses: ./.github/actions/scratch-disk-docker
      # No registry, no secrets: a plain local build and its smoke test (check.sh), so pull
      # requests from forks run it too.
      - run: ./check.sh image

  build:
    needs: [scripts, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Organization access token: the username is the Docker Hub organization.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit's full SLSA provenance of the build, pushed with the image (the repository has
          # no build secrets to leak). No SBOM attestation: Kali's toolset makes an SPDX SBOM larger
          # than the 80 MiB BuildKit accepts, and the export fails.
          sbom: false
          provenance: mode=max
      - run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      # One tag for both architectures: latest, plus the build date to pin or roll back.
      - working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # One argument per digest file: the split is the point.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
      # The multi-arch index just pushed: what the launcher pins.
      - id: digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The published index's build provenance, signed through Sigstore, kept by GitHub and pushed
      # to Docker Hub beside the image: `gh attestation verify oci://...`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # The pushed image itself, by digest, on both architectures: the smoke job tested a local build.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scratch-disk-docker
      - name: Smoke test the published image
        env:
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull -q "$PINNED"
          ./smoke-test.sh "$PINNED"

  # The launcher's pin moved to the digest just published and verified, with this repository's
  # files as they are at this commit (player-account.sh, vm/): one pull request into the
  # launcher's dev, which its owner merges.
  pin:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAUNCHER: Cyber-Courses/Cyber-CTF-Launcher
      PIN: src-tauri/attack-box.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: attack-box
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LAUNCHER }}
          ref: dev
          token: ${{ secrets.LAUNCHER_TOKEN }}
          path: launcher
      - name: Open the pin's pull request
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$(jq -er .image "$PIN")" = "$PINNED" ] && [ "$(jq -er .commit "$PIN")" = "$GITHUB_SHA" ]; then
            echo "The launcher already pins $PINNED with the files at $GITHUB_SHA"
            exit 0
          fi
          # The launcher keeps no copy of the scripts: it downloads them at this commit and checks
          # each against its SHA-256 here.
          files="$(cd ../attack-box && for f in player-account.sh vm/kali.sh vm/toolset.sh vm/desktop.sh; do
            printf '%s\t%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"; done | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add')"
          # An image that changed: the old one joins `previous`, so a player's saved old default
          # moves to the new one.
          jq --arg new "$PINNED" --arg commit "$GITHUB_SHA" --argjson files "$files" \
            '(if .image != $new then .previous = ([.image] + .previous | map(select(. != $new)) | unique) else . end)
             | .image = $new | .commit = $commit | .files = $files' "$PIN" > "$RUNNER_TEMP/attack-box.json"
          mv "$RUNNER_TEMP/attack-box.json" "$PIN"
          branch="attack-box-pin-${PINNED: -12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add "$PIN"
          git commit -qm "Attack box: pin ${PINNED#*@}" -m "Published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with the attack box's files at $GITHUB_SHA."
          git push -q origin "$branch"
          gh pr create --repo "$LAUNCHER" --base dev --head "$branch" \
            --title "Attack box: pin ${PINNED#*@}" \
            --body "The attack box published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with its files at $GITHUB_REPOSITORY@$GITHUB_SHA."
