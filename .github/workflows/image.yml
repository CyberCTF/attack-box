name: Attack box image

# Builds cyberctf/attack-box (the Dockerfile here) for amd64 and arm64 on native runners and
# publishes one multi-arch tag to Docker Hub. Rebuilt weekly because Kali is a rolling release.
# Every run first checks the scripts and builds the image locally and smoke-tests it
# (smoke-test.sh), on pull requests too; only a push to main, the weekly run or a manual run
# publishes, and only once the smoke test passed on both architectures, so a broken Kali update
# never reaches players. The launcher doesn't follow `latest`: it pins the image by digest, with
# this repository's files as they were at the commit that published it. Once a publish is out, the
# pushed digest is pulled and smoke-tested again on both architectures, then the `pin` job opens a
# pull request into the launcher's dev with both.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: cyberctf/attack-box

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The VM set-up's parts are fragments of one script (vm/kali.sh defines `$keep`): each
      # composition the launcher makes must parse, with the player's account between the toolset
      # and the desktop.
      - name: The VM set-up parses
        run: |
          set -euo pipefail
          for parts in "vm/kali.sh vm/toolset.sh" "vm/kali.sh vm/toolset.sh vm/desktop.sh" "vm/kali.sh vm/desktop.sh"; do
            # shellcheck disable=SC2086
            { cat $parts; } | sh -n
          done
      - name: shellcheck
        run: shellcheck player-account.sh smoke-test.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image is large (~14 GB unpacked): Docker keeps its data on the runner's scratch disk.
      - uses: ./.github/actions/scratch-disk-docker
      # No registry, no secrets: a plain local build, so pull requests from forks run it too.
      - name: Build
        run: docker build --pull -t attack-box:smoke .
      - name: Smoke test
        run: ./smoke-test.sh attack-box:smoke

  build:
    needs: [scripts, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Organization access token: the username is the Docker Hub organization.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_ORGA }}
          password: ${{ secrets.DOCKER_OAT }}
      # One tag for both architectures: latest, plus the build date to pin or roll back.
      - working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # One argument per digest file: the split is the point.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
      # The multi-arch index just pushed: what the launcher pins.
      - id: digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The pushed image itself, by digest, on both architectures: the smoke job tested a local build.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scratch-disk-docker
      - name: Smoke test the published image
        env:
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull -q "$PINNED"
          ./smoke-test.sh "$PINNED"

  # The launcher's pin moved to the digest just published and verified, with this repository's
  # files as they are at this commit (player-account.sh, vm/): one pull request into the
  # launcher's dev, which its owner merges.
  pin:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAUNCHER: Cyber-Courses/Cyber-CTF-Launcher
      DIR: src-tauri/attack-box
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: attack-box
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LAUNCHER }}
          ref: dev
          token: ${{ secrets.LAUNCHER_TOKEN }}
          path: launcher
      - name: Open the pin's pull request
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
          PINNED: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          file="$DIR/image.json"
          if [ "$(jq -er .image "$file")" = "$PINNED" ]; then
            echo "The launcher already pins $PINNED"
            exit 0
          fi
          # The old pin joins `previous`, so a player's saved old default moves to the new one.
          jq --arg new "$PINNED" '.previous = ([.image] + .previous | map(select(. != $new)) | unique) | .image = $new' "$file" > "$RUNNER_TEMP/image.json"
          mv "$RUNNER_TEMP/image.json" "$file"
          cp ../attack-box/player-account.sh "$DIR/player-account.sh"
          mkdir -p "$DIR/vm"
          cp ../attack-box/vm/kali.sh ../attack-box/vm/toolset.sh ../attack-box/vm/desktop.sh "$DIR/vm/"
          branch="attack-box-pin-${PINNED: -12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add "$DIR"
          git commit -qm "Attack box: pin ${PINNED#*@}" -m "Published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with the attack box's files at $GITHUB_SHA."
          git push -q origin "$branch"
          gh pr create --repo "$LAUNCHER" --base dev --head "$branch" \
            --title "Attack box: pin ${PINNED#*@}" \
            --body "The attack box published and smoke-tested on amd64 and arm64 by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with its files at $GITHUB_REPOSITORY@$GITHUB_SHA."
